<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>生活费 · 页面设计</title>
<style>
:root{--ink:#3f342c;--muted:#8b7a6c;--paper:#faf6f0;--line:#eae1d6;--accent:#94583d;--green:#647763}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:radial-gradient(ellipse at 12% 20%,#f5e0c8,transparent 45%),radial-gradient(ellipse at 88% 80%,#e4e7d9,transparent 44%),#f1ede6;font-family:'Segoe UI','Microsoft YaHei',sans-serif;-webkit-font-smoothing:antialiased}button{font:inherit;border:0;cursor:pointer;color:inherit}button:focus-visible{outline:3px solid #647763;outline-offset:3px}svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.presentation{max-width:1090px;margin:0 auto;padding:46px 38px 55px}.intro{display:flex;justify-content:space-between;align-items:end;margin-bottom:32px}.eyebrow{font-size:10px;font-weight:600;letter-spacing:2.6px;color:var(--accent)}h1{font-size:29px;letter-spacing:1px;font-weight:500;margin:10px 0 0}.intro p{font-size:12px;color:var(--muted);margin:0 0 4px}.stage{display:flex;gap:58px;justify-content:center;align-items:flex-start}.device-wrap{width:398px;min-width:0}.device-label{font-size:11px;color:var(--muted);letter-spacing:2px;display:flex;justify-content:space-between;padding:0 9px;margin-bottom:13px}.phone{height:858px;position:relative;overflow:hidden;border:6px solid #fffdf9;border-radius:43px;background:var(--paper);box-shadow:0 30px 55px -18px #70573830,0 0 0 1px #d7cbb978}.phone:before{content:'';position:absolute;top:-80px;right:-75px;width:300px;height:330px;background:radial-gradient(ellipse,#eddbc27d,transparent 70%);pointer-events:none}.status{height:41px;padding:13px 23px 0;display:flex;justify-content:space-between;align-items:start;font-size:11px;font-weight:600}.status .signals{display:flex;gap:5px;align-items:center}.signals svg{width:13px;height:13px}.screen{padding:14px 21px 24px;position:relative;height:calc(100% - 118px);overflow-y:auto;scrollbar-width:none}.screen::-webkit-scrollbar{display:none}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.top h2{font-size:27px;letter-spacing:1px;margin:0;font-weight:600}.top .circle{background:#fffaf3;border:1px solid #e9dfd2;border-radius:50%;width:39px;height:39px;display:grid;place-items:center;color:#82664e}.date{display:flex;align-items:center;gap:7px;font-size:12px;color:#8b7865;margin-top:8px}.date svg{width:13px;height:13px}.hero{padding:23px 22px 20px;border:1px solid #ead9c3;border-radius:27px;background:linear-gradient(115deg,#f3e3cd 0%,#eddbc1 100%);position:relative;overflow:hidden;box-shadow:0 8px 15px -13px #7f593c60}.hero:before,.hero:after{content:'';position:absolute;width:180px;height:180px;border:1px solid #c2a37835;border-radius:50%;right:-55px;top:-60px}.hero:after{width:140px;height:140px;right:-35px;top:-40px}.hero-label{font-size:12px;color:#7a6552;display:flex;justify-content:space-between;align-items:center}.hero-label svg{width:18px;height:18px}.money{font-size:43px;letter-spacing:-1.8px;line-height:1.3;font-weight:500;margin:12px 0 20px;font-variant-numeric:tabular-nums}.money .currency{font-size:22px;font-weight:400;margin-right:6px;letter-spacing:0}.money .decimal{font-size:25px;color:#8b725b;letter-spacing:-1px}.balance{display:flex;justify-content:space-between;border-top:1px solid #b99a742e;padding-top:16px;gap:8px}.balance span{display:block;font-size:10px;color:#88715b;margin-bottom:7px}.balance b{font-size:14px;font-weight:500}.balance>div:last-child{text-align:right}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.metric{border-radius:21px;background:#fffdf9;border:1px solid #eee5db;padding:16px}.metric.green{background:#e9ede2;border-color:#e0e5d6}.metric-label{display:flex;align-items:center;gap:7px;font-size:11px;color:#847567}.metric-label svg{width:16px;height:16px}.metric.green .metric-label{color:#6a7b60}.metric-value{font-size:25px;margin-top:12px;letter-spacing:-.8px;font-weight:500}.metric-value small{font-size:10px;color:#8c8275;font-weight:400;letter-spacing:0;display:block;margin-top:4px}.actions{display:flex;gap:10px;margin:19px 0 25px}.actions button{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:16px;flex:1;padding:15px 6px;font-size:12px;background:#ede6dc;color:#785d49}.actions button:first-child{background:var(--accent);color:#fffaf4;box-shadow:0 6px 12px #94583d18}.actions svg{width:17px;height:17px}.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.section-title h3{font-size:16px;font-weight:600;margin:0}.tabs{display:flex;background:#eee8df;border-radius:9px;padding:3px;gap:2px}.tabs button{font-size:9px;padding:6px 9px;border-radius:7px;background:none;color:#948575}.tabs .active{background:#fffdf9;color:#665344;box-shadow:0 1px 4px #5a493411}.list{border:1px solid #ece4d9;border-radius:22px;background:#fffcf7;padding:0 15px}.expense{display:flex;align-items:center;gap:11px;padding:16px 0}.expense+.expense{border-top:1px solid #eee7dd}.expense-icon{height:39px;width:39px;display:grid;place-items:center;border-radius:13px;background:#eee4d5;color:#9b7957}.expense-icon.music{background:#e9eadd;color:#7b865f}.expense-icon.power{background:#f4e7d8;color:#b78d5b}.expense-icon svg{width:19px;height:19px}.expense-name{font-size:12px;font-weight:600}.expense-sub{font-size:9px;color:#9a8d80;margin-top:6px}.expense-price{margin-left:auto;text-align:right;font-size:13px;font-weight:500}.expense-price small{display:block;font-size:9px;font-weight:400;color:#9a8d80;margin-top:6px}.nav{position:absolute;bottom:0;left:0;right:0;height:77px;padding:10px 45px 17px;display:flex;gap:37px;background:#fbf8f2f5;border-top:1px solid #eae2d8;backdrop-filter:blur(12px)}.nav button{display:flex;flex:1;align-items:center;justify-content:center;gap:8px;font-size:11px;background:transparent;border-radius:15px;color:#9b8d7e}.nav button.active{background:#ece3d7;color:#84573e}.nav svg{width:19px;height:19px}.phone:after{content:'';position:absolute;bottom:6px;left:calc(50% - 48px);width:96px;height:3px;border-radius:3px;background:#4d4033;opacity:.65}.setting-budget{display:flex;align-items:center;gap:14px;padding:19px;background:linear-gradient(120deg,#f2e4d0,#edddc5);border:1px solid #eadac2;border-radius:23px;margin:4px 0 24px}.budget-icon{width:44px;height:44px;background:#fff7e99c;border-radius:15px;display:grid;place-items:center;color:#9a7451}.setting-budget .label{font-size:11px;color:#8b735c;margin-bottom:7px}.setting-budget strong{font-weight:500;font-size:22px;letter-spacing:-.6px}.chevron{margin-left:auto;color:#ac9b88;width:15px!important}.group{margin-bottom:21px}.group h3{font-size:10px;color:#a09283;letter-spacing:1px;font-weight:400;margin:0 0 10px 5px}.settings-list{border:1px solid #ece4d9;border-radius:21px;background:#fffcf7;padding:0 16px}.setting-row{width:100%;display:flex;align-items:center;gap:12px;background:none;text-align:left;padding:15px 0;min-height:56px;font-size:12px}.setting-row+.setting-row{border-top:1px solid #eee7dd}.setting-row>svg:first-child{color:#9a826a;width:18px;height:18px}.setting-row .value{margin-left:auto;color:#aa9b8a;font-size:10px}.setting-row .desc{font-size:9px;color:#a29485;margin-top:5px}.toggle{margin-left:auto;height:21px;width:36px;border-radius:15px;background:#c4cfb9;padding:3px;display:block}.toggle:after{content:'';display:block;width:15px;height:15px;border-radius:50%;background:#fffdf9;float:right;box-shadow:0 1px 3px #454a2920}.footer-note{text-align:center;font-size:10px;color:#b3a594;margin-top:20px}.preview-note{font-size:11px;text-align:center;color:#9a8977;margin-top:28px}.overlay{position:absolute;inset:0;background:var(--paper);z-index:3;padding:55px 22px 30px;display:none}.overlay.open{display:block}.back{display:flex;align-items:center;gap:7px;background:none;padding:10px 0;color:var(--accent);font-size:12px}.overlay h2{font-size:27px;margin:24px 0 8px}.overlay p{font-size:11px;color:var(--muted)}.history-card{padding:22px;border-radius:22px;background:#fffcf7;border:1px solid var(--line);margin-top:28px;font-size:12px;line-height:2.1}.history-card h3{font-size:17px;margin:0 0 8px}.history-card .total{border-top:1px solid var(--line);display:flex;justify-content:space-between;margin-top:15px;padding-top:14px}.history-card strong{font-size:23px;font-weight:500}dialog{border:1px solid var(--line);border-radius:23px;background:#fffcf7;color:var(--ink);padding:25px;max-width:320px}dialog::backdrop{background:#3f342c55;backdrop-filter:blur(4px)}dialog h3{font-size:18px}dialog p{font-size:13px;line-height:1.8;color:var(--muted)}dialog button{background:var(--accent);color:white;border-radius:12px;padding:10px 20px}.empty{font-size:12px;color:var(--muted);text-align:center;padding:35px 0}.selected{box-shadow:0 0 0 2px #b58d6855,0 30px 55px -18px #70573830}@media(max-width:900px){.stage{gap:26px;flex-wrap:wrap}.presentation{padding:30px 18px}.intro{max-width:398px;margin:0 auto 28px}.intro p{display:none}}@media(max-width:430px){.device-wrap{width:100%;max-width:398px}.phone{border-width:4px;border-radius:33px}.screen{padding-left:18px;padding-right:18px}.presentation{padding:24px 12px}.stage{gap:32px}.nav{padding-left:35px;padding-right:35px}}
</style></head>
<body><div class="presentation"><header class="intro"><div><div class="eyebrow" data-copy="previewBadge"></div><h1 data-copy="previewTitle"></h1></div><p data-copy="previewSubtitle"></p></header><main class="stage" id="stage"></main><p class="preview-note" data-copy="previewNote"></p></div>
<dialog id="notice"><h3 data-copy="demoTitle"></h3><p data-copy="demoBody"></p><button onclick="this.closest('dialog').close()" data-copy="close"></button></dialog>
<script src="content.js"></script><script>
const c=window.PAGE_COPY;
const paths={home:'M3 10 12 3l9 7M5 9v11h5v-6h4v6h5V9',settings:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8M9 3h6l1 3 3 1 2 5-2 5-3 1-1 3H9l-1-3-3-1-2-5 2-5 3-1z',plus:'M12 5v14M5 12h14',arrow:'m9 5 7 7-7 7',down:'m7 10 5 5 5-5',calendar:'M5 5h14v15H5zM8 3v4M16 3v4M5 10h14',wallet:'M4 6h15v14H4zM4 6V4h12v2M15 12h6v5h-6z',leaf:'M5 19C3 8 9 4 20 4c0 11-5 17-12 13M5 20 16 9',chart:'M4 20V9M11 20V4M18 20v-8',music:'M9 18V5l11-2v13M9 9l11-2M9 18c0 3-6 4-6 1s6-4 6-1M20 16c0 3-6 4-6 1s6-4 6-1',power:'m13 2-9 12h7l-1 8 10-13h-8z',history:'M3 11a9 9 0 1 1 2 7M3 4v7h7M12 7v6l4 2',bell:'M5 17h14l-2-4V9a5 5 0 0 0-10 0v4zM10 20h4',download:'M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5',upload:'M12 16V4m-5 5 5-5 5 5M4 16v5h16v-5',sun:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1 1M18 18l1 1M5 19l1-1M18 6l1-1',refresh:'M20 9a8 8 0 1 0 0 7M20 3v6h-6',signal:'M3 19v-3M8 19v-7M13 19V8M18 19V4',battery:'M3 7h17v10H3zM22 10v4'};
function icon(name,cls=''){return `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[name]||paths.wallet}"/></svg>`}
function text(key){return `<span data-copy="${key}"></span>`}
function nav(active){return `<nav class="nav"><button class="${active==='home'?'active':''}" onclick="go('home')">${icon('home')}${text('overview')}</button><button class="${active==='settings'?'active':''}" onclick="go('settings')">${icon('settings')}${text('settings')}</button></nav>`}
function status(){return `<div class="status"><span>9:41</span><div class="signals">${icon('signal')}${icon('battery')}</div></div>`}
function row(ico,key,value='',desc=''){return `<button class="setting-row" onclick="notice()">${icon(ico)}<div>${text(key)}${desc?`<div class="desc">${text(desc)}</div>`:''}</div>${value?`<span class="value">${text(value)}</span>`:''}${icon('arrow','chevron')}</button>`}
function expense(ico,name,period,amount,daily,cls=''){return `<div class="expense"><div class="expense-icon ${cls}">${icon(ico)}</div><div><div class="expense-name">${text(name)}</div><div class="expense-sub">${text(period)}</div></div><div class="expense-price">${text(amount)}<small>${text(daily)}</small></div></div>`}
document.getElementById('stage').innerHTML=`<div class="device-wrap"><div class="device-label"><span>01</span>${text('overview')}</div><section class="phone" id="home" aria-label="首页预览">${status()}<div class="screen"><div class="top"><div><h2>${text('app')}</h2><div class="date">${text('month')}${icon('down')}</div></div><div class="circle">${icon('leaf')}</div></div><div class="hero"><div class="hero-label">${text('budget')}${icon('wallet')}</div><div class="money"><span class="currency">¥</span>${text('amount')}<span class="decimal">${text('decimals')}</span></div><div class="balance"><div>${text('required')}<b data-copy="requiredAmount"></b></div><div>${text('remaining')}<b data-copy="remainingAmount"></b></div></div></div><div class="metrics"><div class="metric green"><div class="metric-label">${icon('leaf')}${text('cost')}</div><div class="metric-value">${text('costAmount')}<small>${text('costUnit')}</small></div></div><div class="metric"><div class="metric-label">${icon('chart')}${text('paid')}</div><div class="metric-value">${text('paidAmount')}<small>${text('paidUnit')}</small></div></div></div><div class="actions"><button onclick="notice()">${icon('plus')}${text('addSubscription')}</button><button onclick="notice()">${icon('plus')}${text('addExpense')}</button></div><div class="section-title"><h3>${text('expenses')}</h3><div class="tabs"><button class="active" onclick="filter(this,false)">${text('active')}</button><button onclick="filter(this,true)">${text('upcoming')}</button></div></div><div class="list" id="expense-list">${expense('home','rent','rentPeriod','rentAmount','rentDaily')}${expense('music','music','musicPeriod','musicAmount','musicDaily','music')}${expense('power','electricity','electricityPeriod','electricityAmount','electricityDaily','power')}</div><div class="list empty" id="empty" hidden>—</div></div>${nav('home')}</section></div><div class="device-wrap"><div class="device-label"><span>02</span>${text('settings')}</div><section class="phone" id="settings" aria-label="设置页预览">${status()}<div class="screen"><div class="top"><h2>${text('settings')}</h2><div class="circle">${icon('settings')}</div></div><div class="setting-budget"><div class="budget-icon">${icon('wallet')}</div><div><div class="label">${text('monthly')}</div><strong>${text('budgetValue')}</strong></div>${icon('arrow','chevron')}</div><div class="group"><h3>${text('general')}</h3><div class="settings-list"><button class="setting-row" onclick="openHistory()">${icon('history')}<div>${text('history')}<div class="desc">${text('historyHint')}</div></div>${icon('arrow','chevron')}</button>${row('sun','appearance','appearanceValue')}<button class="setting-row" onclick="notice()">${icon('bell')}${text('reminders')}<span class="toggle" aria-hidden="true"></span></button></div></div><div class="group"><h3>${text('data')}</h3><div class="settings-list">${row('download','backup')}${row('upload','restore')}</div></div><div class="group"><h3>${text('about')}</h3><div class="settings-list">${row('refresh','update','version')}</div></div><div class="footer-note">${text('app')} · ${text('version')}</div></div>${nav('settings')}<div class="overlay" id="history" role="dialog" aria-label="历史记录"><button class="back" onclick="closeHistory()">‹ ${text('back')}</button><h2>${text('history')}</h2><p>${text('sort')}</p><article class="history-card"><h3>${text('historyName')}</h3><p>${text('historyAdded')}</p><div>${text('historyPeriod')}</div><div>${text('historyDays')}</div><div class="total">${text('total')}<strong>${text('historyAmount')}</strong></div></article></div></section></div>`;
document.querySelectorAll('[data-copy]').forEach(el=>el.textContent=c[el.dataset.copy]??'');
function notice(){document.getElementById('notice').showModal()}
function go(id){document.getElementById(id).scrollIntoView({behavior:'smooth',block:'center'});document.querySelectorAll('.phone').forEach(el=>el.classList.toggle('selected',el.id===id))}
function filter(button,empty){button.parentElement.querySelectorAll('button').forEach(el=>el.classList.toggle('active',el===button));document.getElementById('expense-list').hidden=empty;document.getElementById('empty').hidden=!empty}
let historyTrigger;function openHistory(){historyTrigger=document.activeElement;document.getElementById('history').classList.add('open');document.querySelector('.back').focus()}function closeHistory(){document.getElementById('history').classList.remove('open');historyTrigger?.focus()}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeHistory()});
</script></body></html>
