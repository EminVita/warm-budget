name: Android checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: python scripts/check-contracts.py
      - run: gradle :core:test :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:lintDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk-and-reports
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/lint-results-debug.html
            core/build/reports/tests/test/
            app/build/reports/tests/testDebugUnitTest/
